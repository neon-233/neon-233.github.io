SYSTEM|text|VASP calculation|体系名称|输出文件中的任务说明。|使用简短 ASCII 名称方便批量追踪。

NELMIN|number|2|最少电子步数|每个离子步至少进行的电子迭代次数。|MD 与弛豫可测试更高值，避免过早终止电子迭代。
NELMDL|number|-5|初始固定密度步数|最初若干电子步延迟电荷更新；正负号决定后续离子步是否重复。|通常保留默认；需结合 ALGO 与重启方式判断。

IMIX|number|4|密度混合方案|选择电荷密度混合算法。|通常保留默认 4，避免没有诊断就修改。

`);
  add('accuracy',`
ENCUT|number|520|平面波截断能|平面波基组的动能截断，单位 eV；未指定时由 POTCAR 决定。|520 仅为输入示例。依据最大 ENMAX 和目标物性测试，变胞可从约 1.3×ENMAX 开始。
PREC|text|Accurate|精度等级|控制 FFT 网格和投影等精度设定，不替代 ENCUT。|力、应力和能量差任务通常从 Accurate 起步。

  function compact(r){const out={...r};if(r.grid)out.grid={...r.grid,blocks:r.grid.blocks.map(b=>({...b,values:undefined})),profiles:[0,1,2].map(axis=>({axis,components:r.grid.blocks.map((_,i)=>O.gridProfile(r.grid,r.structure.lattice,axis,i))})),note:'完整三维网格留在原文件；本报告包含全部分量统计和三轴平面平均。'};if(r.trajectory)out.trajectory={template:r.trajectory.template,frames:r.trajectory.frames.map(f=>({index:f.index,segment:f.segment,lattice:f.lattice})),note:'原子轨迹坐标请保留原始 XDATCAR / XML；本报告不重复大型坐标数组。'};return out;}
  function chartCsv(spec){return O.toCsv(['series','x ['+spec.xlabel+']','y ['+spec.ylabel+']','source'],spec.series.flatMap(s=>s.points.map(p=>[s.name,p.x,p.y,s.source||spec.source])));}
  function fileCsv(r){const out={};if(r.steps.length){const cols=[...new Set(r.steps.flatMap(s=>Object.keys(s)))].filter(k=>!['structure','forces','stress','netForce','magnetizationVector'].includes(k));out['ionic.csv']=O.toCsv(cols,r.steps.map(s=>cols.map(k=>s[k])));const forces=r.steps.flatMap(s=>(s.forces||[]).map((a,i)=>[s.step,i+1,...a]));if(forces.length)out['forces.csv']=O.toCsv(['step','ion','x_A','y_A','z_A','Fx_eV_A','Fy_eV_A','Fz_eV_A'],forces);const stress=r.steps.filter(s=>s.stress).map(s=>[s.step,...s.stress,s.pressure,s.externalPressure,s.volume]);if(stress.length)out['stress.csv']=O.toCsv(['step','xx_kbar','yy_kbar','zz_kbar','xy_kbar','yz_kbar','zx_kbar','trace_over_3_kbar','external_kbar','volume_A3'],stress);}
    if(r.electronic.length){const cols=[...new Set(r.electronic.flatMap(s=>Object.keys(s)))];out['electronic.csv']=O.toCsv(cols,r.electronic.map(s=>cols.map(k=>s[k])));}
    if(r.dos){const d=r.dos;out['dos.csv']=O.toCsv(['E_eV',...d.columns.map(x=>x.label)],d.energies.map((e,i)=>[e,...d.columns.map(x=>x.values[i])]));for(const p of d.partial){const labels=p.labels||O.dosLabels(p.rows[0].length,d.spinCount).labels;out['pdos-ion-'+p.ion+'.csv']=O.toCsv(['E_eV',...labels],p.rows.map((row,i)=>[d.energies[i],...row]));}}
    if(r.bands)out['bands.csv']=O.toCsv(['kpoint','kx','ky','kz','weight','band','spin','E_eV','occupation'],r.bands.points.flatMap(p=>p.bands.flatMap(b=>b.energies.map((e,i)=>[p.index,...(p.coords||[null,null,null]),p.weight,b.index,i+1,e,b.occupancies[i]]))));
    r.tables.forEach((t,i)=>out['table-'+(i+1)+'.csv']=O.toCsv(t.columns,t.rows));if(r.phonons?.length)out['phonons.csv']=O.toCsv(['mode','imaginary','THz','cm-1','meV'],r.phonons.map(p=>[p.mode,p.imaginary,p.THz,p.cm1,p.meV]));
    if(r.grid)for(let a=0;a<3;a++)r.grid.blocks.forEach((_,i)=>out[`grid-axis-${a}-component-${i}.csv`]=O.toCsv(['fraction','distance_A','value_'+r.grid.unit],O.gridProfile(r.grid,r.structure.lattice,a,i).map(p=>[p.fraction,p.distance,p.value])));
    if(r.structure)out['final-POSCAR']=C.serializePoscar({...r.structure,tail:''});return out;
  }
  async function exportAll(){if(state.busy)return;const g=group(),out={};bridge.toast?.('正在整理分析数据…');await new Promise(resolve=>setTimeout(resolve,30));
    const manifest={schema:'vasp-output-analysis/2',parser:O.VERSION,createdAt:new Date().toISOString(),group:g.name,syntheticDemo:g.demo,files:g.files.map(f=>({name:f.name,bytes:f.size,kind:f.parsed?.kind,error:f.error,warnings:f.parsed?.warnings})),displaySettings:state.config};out['manifest.json']=stringify(manifest);out['README.txt']='VASP 小助手输出分析包\n'+(g.demo?'SYNTHETIC DEMO - NOT VASP RESULTS\n':'')+'原文件需自行留存。逐文件保留来源与字段；不同文件未自动拼接。JSON 包含已解析字段，三维网格与 XDATCAR 大型坐标不重复写入；各轴网格平均在 CSV 中。图表与 viewed-tables 目录是导出时当前页面的显示结果，包含选中的能量零点和镜像约定；逐文件 CSV 保留原始数值。解析不证明物理收敛。\n';
    g.files.forEach((f,i)=>{if(!f.parsed)return;const dir=(i+1)+'-'+f.name.replace(/[^a-zA-Z0-9_.-]/g,'_')+'/';out[dir+'analysis.json']=stringify(compact(f.parsed));Object.entries(fileCsv(f.parsed)).forEach(([name,content])=>out[dir+name]=content);});charts.forEach((s,id)=>{out['current-charts/'+id+'.svg']=svg(s,state.charts[id],true);out['current-charts/'+id+'.csv']=chartCsv(s);});tableData.forEach((t,id)=>out['viewed-tables/'+id+'.csv']=O.toCsv(t.columns,t.rows));bridge.download('vasp-output-analysis.zip',C.zipFiles(out),'application/zip');bridge.toast?.('分析包已导出；请保留原始输出文件。');}
  async function png(id){const spec=charts.get(id),source=svg(spec,state.charts[id],true),url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');canvas.width=2100;canvas.height=1215;canvas.getContext('2d').drawImage(im,0,0,2100,1215);canvas.toBlob(blob=>{if(blob)bridge.download(id+'.png',blob,'image/png');else bridge.toast?.('PNG 编码失败',true);},'image/png');URL.revokeObjectURL(url);};im.onerror=()=>{URL.revokeObjectURL(url);bridge.toast?.('PNG 导出失败，可下载 SVG。',true);};im.src=url;}
  const actions={'compute-msd':()=>computeMsd(),upload:()=>document.getElementById('output-files').click(),demo,export:()=>exportAll().catch(e=>bridge.toast?.(e.message,true)),section:el=>{state.section=el.dataset.section;stopAnimation();render();},'new-group':()=>{const g={id:'g'+Date.now(),name:'计算 '+(state.groups.length+1),files:[],demo:false};state.groups.push(g);state.group=g.id;state.picked={};render();},'remove-group':()=>{const g=group();if(g.files.length&&!confirm('从当前页面移除“'+g.name+'”及其解析结果？原文件不会删除。'))return;state.groups=state.groups.filter(x=>x!==g);if(!state.groups.length)state.groups=[{id:'g'+Date.now(),name:'计算 1',files:[],demo:false}];state.group=state.groups[0].id;state.picked={};render();},cancel:()=>{state.cancelled=true;worker?.terminate();worker=null;rejectWorker?.(Error('已取消'));rejectWorker=null;},'remove-file':el=>{group().files=group().files.filter(f=>f.id!==el.dataset.id);render();},original:el=>{const f=group().files.find(f=>f.id===el.dataset.id);if(f?.original)bridge.download(f.name,f.original);},'json-file':el=>{const f=group().files.find(f=>f.id===el.dataset.id);if(f?.parsed)bridge.download(f.name+'.analysis.json',stringify(compact(f.parsed)),'application/json');},'table-csv':el=>{const t=tableData.get(el.dataset.id);bridge.download(el.dataset.id+'.csv',O.toCsv(t.columns,t.rows),'text/csv;charset=utf-8');},'chart-csv':el=>bridge.download(el.dataset.id+'.csv',chartCsv(charts.get(el.dataset.id)),'text/csv;charset=utf-8'),'chart-svg':el=>bridge.download(el.dataset.id+'.svg',svg(charts.get(el.dataset.id),state.charts[el.dataset.id],true),'image/svg+xml'),'chart-png':el=>png(el.dataset.id),'chart-reset':el=>{const id=el.dataset.id;state.charts[id]={log:false,hidden:[],xmin:'',xmax:'',ymin:'',ymax:''};render();},'heatmap-png':()=>document.getElementById('output-heatmap').toBlob(b=>bridge.download('grid-slice.png',b,'image/png')),'frame-export':()=>bridge.download('POSCAR',C.serializePoscar({...selectedStructure(),tail:''})),'use-structure':()=>{const s=selectedStructure();if(s)bridge.useStructure?.(C.clone({...s,tail:''}));},play:()=>{if(animation){stopAnimation();render();return;}animation=setInterval(()=>{const f=source('traj',r=>r.trajectory||r.structure),t=getTrajectory(f?.parsed||{});if(!t||!document.getElementById('output-structure')){stopAnimation();return;}state.config.trajFrame=(state.config.trajFrame+1)%t.frames.length;render();},250);render();}};
  window.VaspOutputUI={html,mount,destroy,importFiles,hasData:()=>state.groups.some(g=>g.files.length),isBusy:()=>state.busy};
})();

</script>
<script>
(function(){
  'use strict';
  const C=VaspCore,D=VaspData,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paths={cube:'m12 3 9 5v9l-9 5-9-5V8l9-5Z M3 8l9 5 9-5 M12 13v9',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',book:'M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-3-1-6-2-10 1v15',help:'M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3 M12 17h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',upload:'M12 16V3 m-5 5 5-5 5 5 M4 15v6h16v-6',download:'M12 3v13 m-5-5 5 5 5-5 M4 17v4h16v-4',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',sliders:'M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6',copy:'M8 8h13v13H8z M16 8V3H3v13h5',arrow:'M5 12h14 m-5-5 5 5-5 5',refresh:'M20 7v5h-5 M4 17v-5h5 M6 7a7 7 0 0 1 13 2 M18 17A7 7 0 0 1 5 15',check:'m5 12 4 4L19 6',code:'m8 6-6 6 6 6 m8-12 6 6-6 6 M14 3l-4 18',file:'M5 2h9l5 5v15H5z M14 2v6h5 M8 12h8 M8 16h8',folder:'M3 6h7l2 3h9v12H3z M3 6V3h7l2 3h9v3',clock:'M12 7v5l4 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',atom:'M12 3v18 M3 12h18 M5 5l14 14 M19 5 5 19 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',chart:'M4 3v17h17 M7 16l4-9 4 5 5-8',heat:'M10 14V4a2 2 0 0 1 4 0v10a4 4 0 1 1-4 0 M12 10v7',layers:'m12 3 10 5-10 5L2 8l10-5Z M2 12l10 5 10-5 M2 16l10 5 10-5',link:'M9 15l6-6 M10 6l2-2a5 5 0 0 1 8 8l-2 2 M14 18l-2 2a5 5 0 0 1-8-8l2-2',close:'M5 5l14 14 M19 5 5 19',lock:'M6 10h12v11H6z M8 10V6a4 4 0 0 1 8 0v4',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0'};
  const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
  const btn=(label,action,cls='',extra='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
  const field=(label,html)=>`<label class="field"><span>${label}</span>${html}</label>`;
  const option=(v,label,selected)=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`;
  const input=(id,value,extra='')=>`<input id="${id}" value="${esc(value)}" ${extra}>`;
  const preset=()=>D.presets.find(p=>p.id===state.task)||{id:'custom',name:'自定义 / 导入',spacing:state.spacing,tip:'当前为自定义或导入的 INCAR。请检查完整参数与文件依赖；k 点间距按当前设置显示。',params:{}};
  const initial=()=>{const s=C.parsePoscar(D.examples.silicon);return {schema:'vasp-workbench/1',name:'silicon-demo',structure:s,incar:C.clone(D.presets[0].params),task:'relax',kpoints:{kind:'mesh',scheme:'Gamma',mesh:C.recommendMesh(s,.25),shift:[0,0,0]},spacing:.25,periodic:[true,true,true],autoMesh:true,potentials:{Si:'Si'},potcarMeta:[],potentialFamily:'PBE'};};
  let state=initial(),active='INCAR',nav='work',viewMode='form',filter='',group='',drafts={},selected=new Set(),history=[],viewers=[],camera=null,atomPage=0,potcarFile=null,uploadKind='',modalCallback=null,storageOK=true,toastTimer;
  let restoreMessage='';
  try {const saved=localStorage.getItem('vasp-workbench-v1');if(saved){state={...initial(),...C.validateSession(JSON.parse(saved)),potcarMeta:[]};restoreMessage='已恢复本地项目；POTCAR 原文件不会持久化。';}}catch(e){restoreMessage='未能恢复本地缓存，已打开示例。可通过项目 JSON 恢复。';}
  function toast(text,error=false){const el=$('#toast');el.textContent=text;el.className='visible'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',error?7000:4000);}
  const safe=fn=>{try{return fn();}catch(e){toast(e.message,true);return false;}};
  function persist(){try{localStorage.setItem('vasp-workbench-v1',JSON.stringify({...state,potcarMeta:[]}));storageOK=true;}catch(e){storageOK=false;}const el=$('#save-state');if(el)el.textContent=storageOK?'已保存至本机':'缓存不可用，请导出项目';}
  function dirty(){return Object.entries(drafts).some(([k,v])=>v!==fileText(k));}
  function requireClean(){if(dirty()){toast('有未应用的原文修改，请先应用或放弃修改。',true);return false;}return true;}
  function ensurePotentials(){const next={};state.structure.species.forEach(e=>next[e]=state.potentials?.[e]||D.potentials[e]?.[0]||e);state.potentials=next;}
  function recalc(){if(state.autoMesh&&state.kpoints.kind==='mesh')state.kpoints.mesh=C.recommendMesh(state.structure,state.spacing,state.periodic);ensurePotentials();}
  function issues(){const list=C.validateProject(state);if(dirty())list.unshift({level:'error',message:'存在未应用的原文修改，请先应用或放弃。'});return list;}
  function potRecipe(){
    const choices=state.structure.species.map(e=>state.potentials[e]||e);
    if(choices.some(v=>! /^[A-Za-z][A-Za-z0-9_.]*$/.test(v)))throw Error('赝势目录名仅支持字母、数字、下划线和点');
    return `# 在包含 POSCAR 的计算目录中执行（Linux / WSL）\n# 先在 ~/.vaspkit 设置本地授权势库，例如：\n# ${state.potentialFamily}_PATH  '/your/licensed/${state.potentialFamily}/potpaw.64'\n# POTCAR_TYPE  ${state.potentialFamily}\n# 当前 POSCAR 顺序: ${state.structure.species.join(' ')}\n# 已选势目录: ${choices.join(' ')}\n\n# 104：按下面的明确顺序选择赝势\nprintf '%s\\n' '104' ${choices.map(x=>`'${x}'`).join(' ')} | vaspkit\n\n# 103：使用 ~/.vaspkit 的默认/推荐势；不保证与上面的自选势相同\n# vaspkit -task 103\n\n# 生成后核对 TITEL、ENMAX、势库版本和 POSCAR 顺序\ngrep 'TITEL\\|ENMAX' POTCAR\n# 可使用 vaspkit 的 109 菜单进行输入检查\n`;
  }
  function fileText(type){if(type==='INCAR')return C.serializeIncar(state.incar);if(type==='POSCAR')return C.serializePoscar(state.structure);if(type==='KPOINTS')return C.serializeKpoints(state.kpoints);if(type==='POTCAR')return potRecipe();return '';}
  function exportSession(){return JSON.stringify({...state,potcarMeta:[],savedAt:new Date().toISOString()},null,2)+'\n';}
  function download(name,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:name.includes('.')?mime:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制到剪贴板');}catch(e){showModal('复制文本',`<textarea class="editor" readonly aria-label="待复制文本">${esc(text)}</textarea><p>浏览器未开放剪贴板，请全选后复制。</p>`,btn('关闭','close-modal'));}}
  function showModal(title,body,footer='',compact=false){const modal=$('#modal');modal.classList.toggle('compact-dialog',compact);$('#modal-content').innerHTML=`<div class="modal-head"><h2>${title}</h2>${btn(icon('close'),'close-modal','ghost small','aria-label="关闭对话框"')}</div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}`;if(!modal.open)modal.showModal();}
  function confirmAction(title,message,fn,label='确认并继续'){modalCallback=fn;showModal(title,`<p>${message}</p>`,btn('取消','close-modal')+btn(label,'confirm-modal','primary'),true);}
  function closeModal(){if($('#modal').open)$('#modal').close();modalCallback=null;}
  function mutateStructure(next,message){
    if(!requireClean())return;
    const apply=()=>{history.push(C.clone(state.structure));if(history.length>20)history.shift();state.structure=next;selected.clear();atomPage=0;recalc();delete drafts.POSCAR;persist();render();toast(message);};
    if(state.structure.tail)confirmAction('结构包含续跑数据','此结构含速度或预测器等附加数据。修改晶格或原子后将移除这些数据；请先另存原始 CONTCAR。',apply,'移除附加数据并修改');else apply();
  }
  function structureCard(){const s=state.structure,p=C.cellParameters(s.lattice);return `<section class="panel"><div class="panel-head"><div class="panel-title">${icon('cube')}<h2>当前结构</h2></div><span class="badge green">POSCAR</span></div><div class="mini-structure"><span class="viewer-badge">STRUCTURE PREVIEW</span><div class="viewer-controls">${btn(icon('refresh'),'viewer-reset','', 'aria-label="重置结构视角"')}</div><canvas data-viewer="mini" tabindex="0" aria-label="三维结构；拖动旋转，滚轮缩放，方向键旋转"></canvas></div><div class="structure-stats"><div class="stat"><strong>${s.atoms.length}</strong><span>原子数</span></div><div class="stat"><strong>${s.species.length}</strong><span>元素种类</span></div><div class="stat"><strong>${p.volume.toFixed(1)}</strong><span>体积 · Å³</span></div></div><div class="legend">${s.species.map((e,i)=>`<span><i class="legend-dot" style="background:${ElementColors[e]||'#8f9db7'}"></i>${esc(e)} <span class="muted">${C.countsOf(s)[i]}</span></span>`).join('')}<span class="muted" style="margin-left:auto">拖动旋转 · 滚轮缩放</span></div></section>`;}
  function codeCard(){const text=fileText(active),lines=text.trimEnd().split('\n');return `<section class="panel code-panel"><div class="panel-head"><h2>${active==='POTCAR'?'VASPKIT 指令':active+' 预览'}</h2><div class="row"><span class="badge">${drafts[active]!==undefined&&drafts[active]!==fileText(active)?'已应用版本':'LIVE'}</span>${btn(icon('copy'),'copy-file','','aria-label="复制当前文件"')}</div></div><pre class="code-view" aria-label="${active} 文件预览">${lines.map((l,i)=>`<span class="code-line"><span class="line-number">${String(i+1).padStart(2,'0')}</span>${l.startsWith('#')?`<span class="code-comment">${esc(l)}</span>`:active==='INCAR'?esc(l).replace(/^([^=]+)(=)(.*)$/, '<span class="code-key">$1</span>$2<span class="code-value">$3</span>'):esc(l)}</span>`).join('')}</pre><div class="panel-foot"><span>${lines.length} 行 · UTF-8 · LF</span>${btn(icon('download')+(active==='POTCAR'?'下载指令':'下载文件'),'download-file','small')}</div></section>`;}
  function checksCard(){const list=issues(),err=list.filter(x=>x.level==='error').length,warn=list.filter(x=>x.level==='warn').length;return `<section class="panel checks-panel"><div class="panel-head"><div class="panel-title">${icon('check')}<h2>输入检查</h2></div><span class="badge ${err?'red':warn?'amber':'green'}">${err?err+' 项需修正':warn?warn+' 项提醒':'基础检查通过'}</span></div><div class="check-list">${list.slice(0,4).map(issueRow).join('')||'<div class="check-item"><span class="check-symbol">✓</span>格式与已实现的依赖检查通过；仍需收敛测试。</div>'}</div><div class="panel-foot"><span>参数检查不等于计算验证</span>${btn('查看全部','checks','ghost small')}</div></section>`;}
  function issueRow(x){return `<div class="check-item ${x.level}"><span class="check-symbol">${x.level==='error'?'×':x.level==='warn'?'!':'i'}</span><span>${esc(x.message)} ${x.source?`<a href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">Wiki ↗</a>`:''}</span></div>`;}
  function rawEditor(type){const draft=drafts[type]??fileText(type),changed=draft!==fileText(type);return `<div class="panel-body"><p class="prose">${type==='INCAR'?'支持注释、分号、续行、未知标签和引号多行值。应用后统一排版；注释不会进入参数表。':type==='POSCAR'?'支持 VASP 4/5、Direct / Cartesian、缩放因子与固定标记。VASP 4 导入后需补全元素名称。':'支持规则网格、线模式和显式带权重 k 点。线模式高对称路径需由实际晶格确定。'}</p><textarea class="editor spaced" data-draft="${type}" aria-label="${type} 原文编辑器" spellcheck="false">${esc(draft)}</textarea><div id="raw-error" class="raw-error"></div></div><div class="draft-bar ${changed?'dirty':''}" id="draft-bar"><span id="draft-label">${changed?'原文已修改，尚未应用':'原文与工作台一致'}</span><div class="row">${btn('放弃修改','discard-draft','small')}${btn('应用原文','apply-draft','primary small')}</div></div>`;}
  function paramRow(tag){const info=D.parameters.find(p=>p.tag===tag),v=state.incar[tag];const ctrl=info?.type==='bool'?`<select data-param="${tag}" aria-label="${tag} 参数值">${option('.TRUE.','.TRUE.',C.isTrue(v)?'.TRUE.':'.FALSE.')}${option('.FALSE.','.FALSE.',C.isTrue(v)?'.TRUE.':'.FALSE.')}</select>`:`<input data-param="${tag}" aria-label="${tag} 参数值" value="${esc(v)}" spellcheck="false">`;return `<details class="param" data-tag="${tag}"><summary><div><span class="param-name">${esc(tag)}</span><span class="param-cn">${info?.label||'自定义参数'}</span></div>${ctrl}${btn('×','remove-param','param-remove',`data-tag="${tag}" aria-label="移除 ${tag}"`)}</summary><div class="param-detail"><p>${info?.description||'保留原始标签和值。此参数未内置说明，请依据对应版本文档核对。'}</p><p><strong>设置建议：</strong>${info?.recommendation||'自定义参数不提供语义校验；请检查 VASP 版本和 OUTCAR 解析结果。'}</p><a href="${info?.source||'https://www.vasp.at/wiki/'+encodeURIComponent(tag)}" target="_blank" rel="noopener noreferrer">查看 VASP Wiki ${esc(tag)} ↗</a></div></details>`;}
  function parameterList(){const tags=Object.keys(state.incar).filter(t=>{const p=D.parameters.find(x=>x.tag===t);return(!group||(p?.group||'custom')===group)&&(!filter||(t+' '+(p?.label||'')).toLowerCase().includes(filter.toLowerCase()));});const gs=[...new Set(tags.map(t=>D.parameters.find(p=>p.tag===t)?.group||'custom'))];return gs.map(g=>`<div class="param-group-title">${D.groups[g]||'自定义参数'} <span class="muted">/ ${tags.filter(t=>(D.parameters.find(p=>p.tag===t)?.group||'custom')===g).length}</span></div>${tags.filter(t=>(D.parameters.find(p=>p.tag===t)?.group||'custom')===g).map(paramRow).join('')}`).join('')||'<div class="empty">没有匹配的已选参数。可在参数库中搜索并添加。</div>';}
  function incarPanel(){const tasks=D.presets.slice(0,6),icons=['sliders','cube','atom','chart','layers','heat'];return `<div class="main-stack"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('sliders')}<h2>选择计算任务</h2></div><span class="muted">从预设开始，自由调整</span></div><div class="panel-body"><div class="task-grid">${tasks.map((p,i)=>btn(`${icon(icons[i])}<strong>${p.short}</strong><small>${p.description}</small>`,'preset','task-card '+(state.task===p.id?'active':''),`data-preset="${p.id}"`)).join('')}</div><div class="task-other row wrap"><label for="preset-select">全部任务</label><select id="preset-select">${state.task==='custom'?option('custom','自定义 / 导入','custom'):''}${D.presets.map(p=>option(p.id,p.name,state.task)).join('')}</select><span class="badge">${D.presets.length} 个预设</span></div><div class="hint">${icon('help')}<span>${esc(preset().tip)}</span></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title"><h2>INCAR 参数</h2><span class="pill-number">${Object.keys(state.incar).length}</span></div><div class="row"><div class="tabs-small">${btn('参数表','view-form',viewMode==='form'?'active':'')}${btn('原文','view-raw',viewMode==='raw'?'active':'')}</div>${btn(icon('plus')+'添加参数','library','soft small')}</div></div>${viewMode==='raw'?rawEditor('INCAR'):`<div class="param-toolbar"><div class="search">${icon('search')}<input id="param-search" placeholder="搜索已选参数，如 ENCUT" aria-label="搜索已选参数" value="${esc(filter)}"></div><select id="param-group" aria-label="参数分组">${option('','全部模块',group)}${Object.entries(D.groups).map(([k,v])=>option(k,v,group)).join('')}${option('custom','自定义',group)}</select></div><div id="parameter-list">${parameterList()}</div><div class="panel-foot"><span>点击参数展开说明与设置建议</span>${btn(icon('plus')+'自定义标签','custom-param','ghost small')}</div>`}</section></div>`;}
  function structurePanel(){const s=state.structure,p=C.cellParameters(s.lattice),counts=C.countsOf(s);const npage=Math.ceil(s.atoms.length/80);atomPage=Math.min(atomPage,npage-1);return `<div class="main-stack"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('cube')}<h2>结构编辑</h2><span class="badge">${s.atoms.length} atoms</span></div><div class="row"><div class="tabs-small">${btn('三维视图','view-form',viewMode==='form'?'active':'')}${btn('原文','view-raw',viewMode==='raw'?'active':'')}</div>${btn('撤销','undo-structure','small',history.length?'':'disabled')}</div></div>${viewMode==='raw'?rawEditor('POSCAR'):`<div class="panel-body"><div class="row between wrap tab-heading"><span class="mono muted">${esc(s.title)}</span><div class="row"><select id="example-select" aria-label="加载示例结构" style="width:125px"><option value="">加载示例结构…</option><option value="silicon">Si · 金刚石型</option><option value="mos2">MoS₂ · 单层</option><option value="nacl">NaCl · 岩盐型</option></select></div></div><div class="mini-structure large-structure"><span class="viewer-badge">3D STRUCTURE · SELECT ATOMS</span><div class="viewer-controls">${btn('a','viewer-axis','small','data-axis="a" aria-label="沿 a 视角"')}${btn('b','viewer-axis','small','data-axis="b" aria-label="沿 b 视角"')}${btn('c','viewer-axis','small','data-axis="c" aria-label="沿 c 视角"')}${btn(icon('refresh'),'viewer-reset','','aria-label="重置结构视角"')}</div><canvas data-viewer="large" tabindex="0" aria-label="可交互三维结构：点击原子选择，按住 Ctrl 或 Shift 多选，拖动旋转，滚轮缩放"></canvas></div><div class="viewer-caption"><span>拖动旋转 · 滚轮缩放 · 点击选择 · Ctrl / Shift 多选</span><div class="row"><label class="option-check"><input type="checkbox" id="show-bonds" checked>近邻连线</label><label class="option-check"><input type="checkbox" id="show-labels">标签</label></div></div><div class="native-note">连线仅显示胞内近邻，不代表化学键；超过 600 原子时关闭连线以保证性能。</div><div class="fields four spaced"><div class="stat"><strong>${p.volume.toFixed(3)}</strong><span>晶胞体积 / Å³</span></div>${p.angles.map((v,i)=>`<div class="stat"><strong>${v.toFixed(2)}°</strong><span>${['α','β','γ'][i]} 夹角</span></div>`).join('')}</div></div>`}</section>${viewMode==='form'?`<section class="panel"><div class="panel-head"><h2>晶格与扩胞</h2><a class="muted" href="https://www.vasp.at/wiki/POSCAR" target="_blank" rel="noopener noreferrer">POSCAR 格式 ↗</a></div><div class="panel-body"><div class="fields">${p.lengths.map((v,i)=>field('abc'[i]+' / Å',input('length-'+i,v.toFixed(6),'type="number" min="0.000001" step="any"'))).join('')}</div><div class="row between wrap spaced">${field('修改时保持',`<select id="keep-coordinate">${option('frac','分数坐标（随晶胞缩放）','frac')}${option('cart','笛卡尔坐标（原子不动）','frac')}</select>`)}${btn('应用晶胞常数','apply-lengths','soft')}</div><details class="spaced"><summary class="muted">编辑完整晶格矩阵（Å）</summary><div class="matrix spaced">${s.lattice.map((r,i)=>`<span>${'abc'[i]}</span>${r.map((v,j)=>input(`matrix-${i}-${j}`,v.toFixed(8),'type="number" step="any" aria-label="晶格 '+i+' '+j+'"')).join('')}`).join('')}</div><div class="row row-end spaced">${btn('应用矩阵','apply-matrix','soft small')}</div></details><div class="fields spaced-lg">${[0,1,2].map(i=>field('沿 '+ 'abc'[i]+' 扩胞',input('rep-'+i,1,'type="number" min="1" max="100" step="1"'))).join('')}</div><div class="row between spaced"><span class="muted" style="font-size:10px">对角超胞 · 同步更新数量与 k 点建议</span>${btn(icon('layers')+'生成超胞','supercell','primary small')}</div><div class="fields two spaced-lg">${field('坐标导出格式',`<select id="coord-mode">${option('Direct','Direct · 分数坐标',s.mode)}${option('Cartesian','Cartesian · 笛卡尔坐标',s.mode)}</select>`)}${field('元素分组（按原顺序）',input('species-names',s.species.join(' '),'aria-label="元素名称顺序"'))}</div><div class="row between spaced">${btn('坐标折回晶胞','wrap-atoms','small')}${btn('应用元素名称','apply-species','small')}</div>${s.legacy?'<div class="notice warn">VASP 4 文件未携带元素名。请将 X1、X2 等占位名替换为真实元素，并核对 POTCAR。</div>':''}</div></section><section class="panel"><div class="panel-head"><div class="panel-title"><h2>原子位点</h2><span class="badge" id="selection-count">已选 ${selected.size}</span></div><div class="atom-actions">${btn('固定','fix-selected','small')}${btn('释放','free-selected','small')}${btn('删除','delete-selected','danger small')}</div></div><div class="atom-table-wrap"><table><thead><tr><th><input type="checkbox" id="select-all" aria-label="选择所有原子" ${selected.size===s.atoms.length?'checked':''}></th><th>位点</th><th>元素</th><th>f₁</th><th>f₂</th><th>f₃</th><th>可移动 a / b / c</th></tr></thead><tbody>${s.atoms.slice(atomPage*80,(atomPage+1)*80).map((a,j)=>{const i=atomPage*80+j;return `<tr data-atom-row="${i}" class="${selected.has(i)?'selected':''}"><td><input type="checkbox" data-atom-select="${i}" aria-label="选择位点 ${i+1}" ${selected.has(i)?'checked':''}></td><td>${i+1}</td><td>${esc(s.species[a.group])}</td>${a.frac.map((v,q)=>`<td><input data-atom-coordinate="${i}" data-axis="${q}" aria-label="位点 ${i+1} 分数坐标 ${q+1}" value="${Number(v.toFixed(6))}"></td>`).join('')}<td><div class="atom-flags">${a.flags.map((f,q)=>`<label><input type="checkbox" data-atom-flag="${i}" data-axis="${q}" aria-label="位点 ${i+1} 允许沿 ${'abc'[q]} 移动" ${f?'checked':''}>${'abc'[q]}</label>`).join('')}</div></td></tr>`;}).join('')}</tbody></table></div><div class="panel-foot"><span>勾选为 T（可移动），取消为 F。固定方向按直接晶格基定义。</span><div class="row">${btn('‹','atoms-prev','small',atomPage===0?'disabled':'')}<span>${atomPage+1}/${npage}</span>${btn('›','atoms-next','small',atomPage>=npage-1?'disabled':'')}</div></div></section>`:''}</div>`;}
  function kpointsPanel(){const s=state.structure,k=state.kpoints,mesh=k.kind==='mesh'?k.mesh:[1,1,1];return `<div class="main-stack"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('grid')}<h2>布里渊区采样</h2></div><div class="tabs-small">${btn('网格设置','view-form',viewMode==='form'?'active':'')}${btn('原文 / 路径','view-raw',viewMode==='raw'?'active':'')}</div></div>${viewMode==='raw'?rawEditor('KPOINTS'):`<div class="panel-body"><div class="fields two">${field('网格类型',`<select id="k-scheme">${option('Gamma','Gamma · Γ 中心',k.scheme||'Gamma')}${option('Monkhorst-Pack','Monkhorst–Pack',k.scheme||'Gamma')}</select>`)}${field('目标间距 / Å⁻¹',input('k-spacing',state.spacing,'type="number" min="0.005" max="10" step="0.01"'))}</div><div class="density-options">${[[.35,'初步测试'],[.25,'常规起点'],[.15,'较密网格']].map(([v,l])=>btn(`<strong>${v.toFixed(2)}</strong>${l}`,'density',state.spacing===v?'active':'',`data-density="${v}"`)).join('')}</div><div class="notice">当前任务「${preset().name}」的应用内启发式起点：${preset().spacing} Å⁻¹。不同材料的金属性、各向异性和目标物性需要独立收敛测试。</div><div class="row between wrap spaced"><label class="option-check"><input id="auto-mesh" type="checkbox" ${state.autoMesh?'checked':''}>晶胞变化时自动更新网格</label>${btn('应用当前建议','recommend-mesh','soft small')}</div><div class="k-mesh">${mesh.map((n,i)=>`${i?'<span>×</span>':''}<input id="mesh-${i}" value="${n}" type="number" min="1" step="1" aria-label="k 点网格 ${i+1}">`).join('')}</div><div class="row between"><span class="badge">${mesh.reduce((a,b)=>a*b,1)} 个完整网格点 · 约化前</span>${btn('应用手动网格','manual-mesh','primary small')}</div><div class="fields spaced-lg">${[0,1,2].map(i=>field('平移 s'+(i+1),input('shift-'+i,k.shift?.[i]||0,'type="number" step="any"'))).join('')}</div><div class="periodic-label">周期采样方向（取消某方向会将建议网格设为 1）</div><div class="row wrap">${state.periodic.map((x,i)=>`<label class="option-check"><input type="checkbox" data-periodic="${i}" ${x?'checked':''}>${'abc'[i]} 方向</label>`).join('')}</div><div class="hint">${icon('help')}<span>二维材料可手动关闭真空方向的采样；不会仅凭晶胞长度自动判断真空。Γ 网格通常更适合六方结构。</span></div>${k.kind!=='mesh'?'<div class="notice warn">当前导入的是线模式/显式 k 点。应用网格将替换它；原文页可检查现有路径。</div>':''}</div>`}</section><section class="panel"><div class="panel-head"><h2>与 POSCAR 联动的建议</h2><span class="badge green">RECIPROCAL SPACE</span></div><div class="panel-body"><table><thead><tr><th>方向</th><th>实空间 / Å</th><th>2π|bᵢ| / Å⁻¹</th><th>建议 Nᵢ</th></tr></thead><tbody>${C.reciprocal(s.lattice).map((b,i)=>`<tr><td>${'abc'[i]}</td><td>${C.norm(s.lattice[i]).toFixed(4)}</td><td>${(2*Math.PI*C.norm(b)).toFixed(4)}</td><td>${C.recommendMesh(s,state.spacing,state.periodic)[i]}</td></tr>`).join('')}</tbody></table><div class="notice"><span class="mono">Nᵢ = max(1, ceil(2π|bᵢ| / Δk))</span><br>这里 bᵢ·aⱼ = δᵢⱼ，适用于一般非正交晶胞。公式参考 <a href="https://www.vasp.at/wiki/KSPACING" target="_blank" rel="noopener noreferrer">VASP KSPACING ↗</a>。VASPKIT 的 kpr 单位约定不同：Δk = 2π × kpr。</div><h3 class="spaced">能带路径</h3><p class="prose spaced">导入经过晶格标准化确认的 KPOINTS 线模式文件。VASPKIT 303（3D）或 302（2D）可辅助生成路径；如标准化改变了结构基，SCF 与能带都应使用对应的新结构。</p><div class="row spaced">${btn('编辑路径原文','view-raw','soft small')}${btn('上传 KPOINTS','upload','small','data-file="KPOINTS"')}<a href="https://vaspkit.com/tutorials.html#band-structure" target="_blank" rel="noopener noreferrer">路径文档 ↗</a></div></div></section></div>`;}
  function potcarPanel(){const s=state.structure,meta=state.potcarMeta||[];return `<div class="main-stack"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('layers')}<h2>赝势选择建议</h2></div><span class="badge">跟随 POSCAR 元素顺序</span></div><div class="panel-body"><div class="fields two">${field('势库泛函',`<select id="potential-family">${option('PBE','PBE · PAW',state.potentialFamily)}${option('LDA','LDA · PAW',state.potentialFamily)}</select>`)}<div class="field"><span>选择依据</span><a href="https://www.vasp.at/wiki/Choosing_pseudopotentials" target="_blank" rel="noopener noreferrer">VASP Wiki · 赝势选择 ↗</a></div></div><div class="notice">以下是常规 DFT 的测试起点，名称参考 PAW 势表。请核对本地势库版本、可用变体与目标物性；不提供或分发势文件。</div>${s.species.map((e,i)=>`<div class="potential-row"><div class="element-tile">${esc(e)}</div><div><h3>${esc(e)} <span class="muted" style="font-size:10px;font-weight:400">${C.countsOf(s)[i]} 个原子 · 第 ${i+1} 组</span></h3><p>${D.potentialReason(e)}</p></div><div><input list="pots-${i}" data-potential="${esc(e)}" value="${esc(state.potentials[e]||e)}" aria-label="${esc(e)} 赝势目录名"><datalist id="pots-${i}">${(D.potentials[e]||[e]).map(v=>`<option value="${v}">`).join('')}</datalist></div></div>`).join('')}<div class="hint">${icon('help')}<span>_pv 包含半芯 p 态；_sv 包含半芯 s/p 态；_d 将低能 d 态纳入价电子。_h / _s 为硬 / 软变体；杂化泛函避免软势，激发态另查 _GW 系列。</span></div></div></section><section class="panel"><div class="panel-head"><h2>在计算环境中生成 POTCAR</h2>${btn(icon('copy')+'复制指令','copy-file','small')}</div><div class="panel-body"><p class="prose">先配置 <span class="mono">~/.vaspkit</span> 的本地授权势库路径，再将 POSCAR 放到工作目录中，执行以下指令。104 使用当前选择，103 使用 VASPKIT 配置中的默认选择。</p><pre class="recipe">${esc(potRecipe())}</pre><div class="row wrap">${btn(icon('download')+'下载生成指引','download-file','primary small')}${btn('导出选择清单 JSON','download-pot-selection','small')}<a href="https://vaspkit.com/tutorials.html#generate-potcar" target="_blank" rel="noopener noreferrer">VASPKIT 官方说明 ↗</a></div></div></section><section class="panel"><div class="panel-head"><h2>检查已有 POTCAR</h2><span class="badge">仅本地读取</span></div><div class="panel-body"><button class="upload-zone" style="width:100%;display:block" data-action="upload" data-file="POTCAR">${icon('upload')}上传 POTCAR 或本工具的选择清单 JSON<br><span class="muted">读取 TITEL / ENMAX / ZVAL，并检查元素顺序</span></button>${meta.length?`<div class="spaced" style="overflow:auto"><table><thead><tr><th>势</th><th>ENMAX / eV</th><th>ZVAL</th></tr></thead><tbody>${meta.map(m=>`<tr><td>${esc(m.variant)}</td><td>${m.enmax??'—'}</td><td>${m.zval??'—'}</td></tr>`).join('')}</tbody></table></div><div class="row wrap spaced">${btn('下载原始 POTCAR','download-pot-original','small')}${btn('移除当前 POTCAR','clear-pot','ghost small')}</div><div class="notice">最大 ENMAX = ${Math.max(...meta.map(m=>m.enmax||0))} eV。ENCUT 需据此与目标物性收敛；变胞常测试约 1.3 倍。这里只提取元数据，不验证势文件完整性。</div>`:'<p class="native-note">POTCAR 原文件仅留在当前页面内存中；不会写入缓存或项目 JSON。刷新后需重新上传。</p>'}</div></section></div>`;}
  function libraryContent(query='',cat='',standalone=false){const list=D.parameters.filter(p=>(!cat||p.group===cat)&&(!query||(p.tag+' '+p.label+' '+p.description).toLowerCase().includes(query.toLowerCase())));return list.map(p=>`<div class="library-item"><details><summary><span class="param-name">${p.tag}</span> <span class="badge">${D.groups[p.group]}</span><span class="param-cn">${p.label} · ${p.description}</span></summary><p><strong>建议：</strong>${p.recommendation}</p><p>添加时的示例值：<span class="mono">${esc(p.initial)}</span> · 并非对所有体系的推荐值。</p><a href="${p.source}" target="_blank" rel="noopener noreferrer">VASP Wiki ↗</a></details>${btn(Object.hasOwn(state.incar,p.tag)?'已添加':'+ 添加','add-param',Object.hasOwn(state.incar,p.tag)?'ghost small':'soft small',`data-tag="${p.tag}" ${Object.hasOwn(state.incar,p.tag)?'disabled':''}`)}</div>`).join('')||'<div class="empty">未找到参数，可以添加自定义标签。</div>';}
  function libraryBody(){return `<p class="prose">${D.parameters.length} 个参数，${Object.keys(D.groups).length} 个模块。展开参数查看作用、条件和 Wiki 来源；添加值是可修改的示例。</p><div class="library-tools spaced"><div class="search">${icon('search')}<input id="library-search" placeholder="搜索参数名、功能或关键词" aria-label="搜索参数库"></div><select id="library-group" aria-label="参数库分类"><option value="">所有模块</option>${Object.entries(D.groups).map(([k,v])=>option(k,v,'')).join('')}</select></div><div class="library-list" id="library-list">${libraryContent()}</div>`;}
  function guide(){return `<div class="intro-grid"><section class="guide-step"><h3>01 · 导入结构</h3><p>在 POSCAR 页上传文件、粘贴原文或加载示例。支持 Direct / Cartesian、单值或三值缩放、负缩放体积和 Selective dynamics。三维视图支持旋转、缩放、选择原子。</p><p class="spaced">编辑晶胞、对角扩胞、坐标、固定标记和删除原子。结构操作可撤销 20 步；续跑附加数据在编辑前提示移除。</p></section><section class="guide-step"><h3>02 · 配置任务与参数</h3><p>选择任务预设后，在 INCAR 参数表中逐项修改。点击一行展开作用与建议；参数库可搜索 ${D.parameters.length} 个标签，也可直接添加自定义标签。</p><p class="spaced">预设是本工具整理的测试起点，并非 VASP 官方通用输入。U、磁序、ENCUT、空带数等必须按具体体系确定。</p></section><section class="guide-step"><h3>03 · 核对采样与赝势</h3><p>KPOINTS 使用实际倒格矢计算网格起点。二维结构的真空方向需手动指定。能带路径需自行导入，工具不做空间群识别。</p><p class="spaced">POTCAR 页给出势选择、明确顺序的 VASPKIT 104 指令及默认 103 说明。实际势库需已在本地授权安装。</p></section><section class="guide-step"><h3>04 · 保存和导出</h3><p>各文件支持上传和下载。可整体导出 ZIP，包含 INCAR、POSCAR、KPOINTS、赝势选择清单、生成指引和输入检查报告；已有 POTCAR 需单独下载原件。</p><p class="spaced">项目 JSON 保存全部可编辑设置，不保存 POTCAR 原文。浏览器本地缓存仅作便利，正式工作请导出项目。</p></section><section class="guide-step"><h3>05 · 分析计算输出</h3><p>切换“输出分析”，批量上传同一次计算的 OUTCAR、OSZICAR、XML、DOSCAR、轨迹或网格文件。不同计算新建分组，可从数据来源选择框切换文件。</p><p class="spaced">七类分析页面支持图表、完整 CSV、SVG/PNG 和分析 ZIP。可将输出结构载入输入工作台。输出数据仅在本次页面内存中，刷新前请导出分析包并保留原文件；输入项目 JSON 不包含输出。</p></section><section class="guide-step"><h3>数据与实现边界</h3><p>页面无需网络请求或第三方 CDN。上传文件在当前浏览器中处理。Wiki 链接仅在主动点击时访问外网。</p><p class="spaced">尚未执行 VASP、VASPKIT 或物理收敛验证。支持最多 20,000 原子；大结构可视化性能取决于设备。输出分析支持常用文本输出、图表和 CSV；完整非对角超胞、CIF、自动高对称路径可后续扩展。</p></section><section class="guide-step"><h3>依据与核对日期</h3><p>文档核对：${D.verified}。每个参数附独立 Wiki 链接。依赖版本的设置需与实际安装版本核对。</p><ul><li><a href="https://www.vasp.at/wiki/INCAR" target="_blank" rel="noopener noreferrer">INCAR 格式与参数</a></li><li><a href="https://www.vasp.at/wiki/POSCAR" target="_blank" rel="noopener noreferrer">POSCAR 结构格式</a></li><li><a href="https://www.vasp.at/wiki/KPOINTS" target="_blank" rel="noopener noreferrer">KPOINTS 采样方法</a></li><li><a href="https://www.vasp.at/wiki/Choosing_pseudopotentials" target="_blank" rel="noopener noreferrer">赝势选择与适用条件</a></li><li><a href="https://vaspkit.com/tutorials.html" target="_blank" rel="noopener noreferrer">VASPKIT 官方教程</a></li></ul></section></div>`;}
  function render(){
    VaspOutputUI.destroy();
    if(viewers.length)camera=viewers[0].camera();viewers.forEach(v=>v.destroy());viewers=[];
    const names=['INCAR','POSCAR','KPOINTS','POTCAR'],subs=['计算参数','晶体结构','k 点采样','赝势指引'];
    $('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">${icon('cube')}</div><div><div class="brand-name">VASP 小助手</div><div class="brand-sub">INPUT / OUTPUT WORKBENCH</div></div></div><div><div class="nav-label">WORKSPACE</div><nav class="nav-stack" aria-label="主导航">${btn(icon('grid')+'<span>输入工作台</span>','nav-work','nav-item '+(nav==='work'?'active':''))}<div class="file-nav">${names.map(n=>btn('<span>'+n+'</span>','tab',''+(active===n?'current':''),`data-tab="${n}"`)).join('')}</div>${btn(icon('chart')+'<span>输出分析</span>','nav-output','nav-item '+(nav==='output'?'active':''))}${btn(icon('book')+'<span>参数参考</span>','nav-library','nav-item '+(nav==='library'?'active':''))}${btn(icon('help')+'<span>使用说明</span>','nav-guide','nav-item '+(nav==='guide'?'active':''))}</nav></div><div class="sidebar-note"><strong>${icon('lock')} 文件留在你的设备</strong>离线运行，无需登录。<br>从准备输入，到解析结果。</div><div class="nav-foot"><span class="offline-dot"></span>本地工作空间<br><span style="display:block;margin-top:7px">VASP Workbench / v2.0</span></div></aside><div><header class="topbar"><div class="crumb"><span class="crumb-prefix">工作空间</span><span class="crumb-prefix">/</span>${icon('folder')}<b>${esc(state.name)}</b><span class="badge">LOCAL</span></div><div class="top-actions"><span class="save-indicator">${icon('check')}<span id="save-state">${nav==='output'?'输入已缓存 · 输出请导出':storageOK?'已保存至本机':'请导出项目'}</span></span>${btn(icon('upload')+'打开输入项目','upload','project-open','data-file="PROJECT"')}${btn('保存输入项目','save-project','project-save')}${btn(icon('download')+'导出输入包','export-all','primary')}</div></header><main class="main-content" id="workspace"><div class="workspace-switch">${btn(icon('grid')+'输入工作台','nav-work',nav==='work'?'active':'')}${btn(icon('chart')+'输出分析','nav-output',nav==='output'?'active':'')}</div><div class="page-heading"><div><div class="eyebrow">PREPARE. INSPECT. CALCULATE.</div><h1>${nav==='work'?'输入文件工作台':nav==='output'?'输出文件分析':nav==='library'?'参数参考库':'使用说明'}</h1><p class="subtitle">${nav==='work'?'把计算想法，变成清晰、可检查的 VASP 输入。':nav==='output'?'从计算记录到能量曲线，每一个数值都保留来源。':nav==='library'?'从参数含义到设置依据，随时查阅，按需添加。':'四个输入文件，一条清晰的准备流程。'}</p></div><div class="heading-actions">${nav==='work'?btn(icon('upload')+'上传 '+active,'upload','',`data-file="${active}"`)+btn(icon('download')+(active==='POTCAR'?'下载指引':'下载 '+active),'download-file'):btn(icon('grid')+'返回工作台','nav-work')}</div></div>${nav==='work'?`<nav class="file-tabs" aria-label="输入文件">${names.map((n,i)=>btn(`<span class="tab-num">0${i+1}</span><div><span class="file-title">${n}</span><span class="file-sub" style="display:block">${subs[i]}</span></div><span class="file-check">${n==='POTCAR'?'↗':'✓'}</span>`,'tab','file-tab '+(active===n?'active':''),`data-tab="${n}" aria-current="${active===n?'page':'false'}"`)).join('')}</nav><div class="work-grid">${active==='INCAR'?incarPanel():active==='POSCAR'?structurePanel():active==='KPOINTS'?kpointsPanel():potcarPanel()}<aside class="side-stack">${active!=='POSCAR'||viewMode==='raw'?structureCard():''}${codeCard()}${checksCard()}</aside></div>`:nav==='output'?VaspOutputUI.html():nav==='library'?`<section class="panel"><div class="panel-body">${libraryBody()}<div class="row spaced">${btn(icon('plus')+'自定义标签','custom-param','soft')}${btn('返回 INCAR','tab','','data-tab="INCAR"')}</div></div></section>`:guide()}<footer class="bottom-note"><span>文件仅在本机处理 · 建议设置需进行收敛测试 · 文档核对 ${D.verified}</span><span><a href="https://www.vasp.at/wiki" target="_blank" rel="noopener noreferrer">VASP Wiki ↗</a> &nbsp; / &nbsp; ${btn('帮助','nav-guide','ghost small')} ${btn('参数库','nav-library','ghost small')}</span></footer></main></div></div>`;
    if(nav==='output')VaspOutputUI.mount({toast,download,useStructure:s=>{if(!requireClean())return;confirmAction('将输出结构用于输入工作台','会替换当前 POSCAR，并重新计算自动 k 网格。原结构可撤销恢复；请核对输入参数是否适用于此结构。',()=>{nav='work';active='POSCAR';viewMode='form';mutateStructure(s,'已载入输出结构，请核对 INCAR 与 POTCAR。');},'载入结构');}});
    document.querySelectorAll('[data-viewer]').forEach(canvas=>viewers.push(new StructureViewer(canvas,state.structure,{camera,selected,onSelect:(i,multi)=>{if(!multi)selected.clear();if(multi&&selected.has(i))selected.delete(i);else selected.add(i);syncSelection();}})));
  }
  function syncSelection(){viewers.forEach(v=>{v.selected=selected;v.draw();});document.querySelectorAll('[data-atom-select]').forEach(el=>el.checked=selected.has(Number(el.dataset.atomSelect)));document.querySelectorAll('[data-atom-row]').forEach(el=>el.classList.toggle('selected',selected.has(Number(el.dataset.atomRow))));if($('#selection-count'))$('#selection-count').textContent='已选 '+selected.size;if($('#select-all'))$('#select-all').checked=selected.size===state.structure.atoms.length;}
  function refreshPreview(){const code=document.querySelector('.code-panel'),checks=document.querySelector('.checks-panel');if(code)code.outerHTML=codeCard();if(checks)checks.outerHTML=checksCard();}
  function openLibrary(){showModal('添加 INCAR 参数',libraryBody(),btn('自定义标签','custom-param')+btn('完成','close-modal','primary'));}
  function refreshLibrary(){const q=$('#library-search')?.value||'',g=$('#library-group')?.value||'';if($('#library-list'))$('#library-list').innerHTML=libraryContent(q,g);}
  function choosePreset(id){if(!requireClean())return render();const p=D.presets.find(x=>x.id===id);if(!p)return;confirmAction('加载「'+p.name+'」',`将用该任务的 ${Object.keys(p.params).length} 个起始参数替换当前 INCAR。可先保存项目以保留现有配置。${esc(p.tip)}`,()=>{state.incar=C.clone(p.params);state.task=p.id;state.spacing=p.spacing;recalc();delete drafts.INCAR;persist();closeModal();render();toast('已加载预设；请设置并收敛 ENCUT。');},'替换并加载');}
  function applyDraft(){const text=drafts[active]??fileText(active);try{
    if(active==='INCAR'){const parsed=C.parseIncar(text);state.incar=parsed.params;state.task='custom';delete drafts.INCAR;persist();render();toast(parsed.warnings.length?parsed.warnings.join('；'):'INCAR 已应用');}
    if(active==='POSCAR'){const s=C.parsePoscar(text);history.push(C.clone(state.structure));state.structure=s;selected.clear();atomPage=0;delete drafts.POSCAR;recalc();persist();render();toast(s.legacy?'已导入；请补全元素名称':'POSCAR 已应用');}
    if(active==='KPOINTS'){state.kpoints=C.parseKpoints(text);state.autoMesh=false;delete drafts.KPOINTS;persist();render();toast('KPOINTS 已应用，自动联动已关闭以保留输入。');}
  }catch(e){if($('#raw-error'))$('#raw-error').textContent=e.message;toast(e.message,true);}}
  function exportFile(){if(!requireClean())return;if(active==='POSCAR'&&state.structure.species.some(e=>!C.elements.includes(e)))return toast('请先补全有效的元素名称。',true);download(active==='POTCAR'?'POTCAR.recipe.txt':active,fileText(active));toast(active==='POTCAR'?'已下载 POTCAR 生成指引':'已下载 '+active);}
  function doExportAll(){if(!requireClean())return;const list=issues();if(list.some(i=>i.level==='error')){showChecks(true);return;}
    const files={INCAR:fileText('INCAR'),POSCAR:fileText('POSCAR'),KPOINTS:fileText('KPOINTS'),'POTCAR.recipe.txt':potRecipe(),'potcar-selection.json':potSelection(),'project.json':exportSession(),'INPUT_CHECKS.txt':`VASP Workbench input checks\nObserved: ${new Date().toISOString()}\nTask: ${preset().name}\n\n${list.map(i=>'['+i.level+'] '+i.message+(i.source?' '+i.source:'')).join('\n')}\n\nThese are static input checks only. VASP and VASPKIT have not been executed. Convergence is not certified.\n`,'README.txt':'VASP Workbench 输入包\n\nINCAR、POSCAR、KPOINTS 为当前编辑状态。\nPOTCAR 未包含：请使用 POTCAR.recipe.txt 在具备授权势库的计算环境中生成，或在网页单独下载已上传原件。\n预设和采样密度仅为起点，需进行物性收敛测试。\n项目可通过 project.json 重新载入。\n先阅读 INPUT_CHECKS.txt，检查所需的 CHGCAR/WAVECAR、NEB 图像等额外文件。\n'};
    download((state.name||'vasp-inputs').replace(/[^a-zA-Z0-9_\-]/g,'_')+'-inputs.zip',C.zipFiles(files),'application/zip');toast('已导出输入包；POTCAR 需在计算环境中生成。');
  }
  function showChecks(forExport=false){const list=issues(),errors=list.filter(x=>x.level==='error');showModal(forExport?'请先修正输入问题':'输入文件检查',`<p>${errors.length?'检测到 '+errors.length+' 项需修正问题。':'已实现的基础检查未发现阻断问题。'} 检查不替代 VASP 运行与收敛验证。</p><div class="warning-list spaced">${list.map(issueRow).join('')||'<div class="notice">基础检查通过。</div>'}</div>`,btn('关闭','close-modal','primary'));}
  function potSelection(){return JSON.stringify({schema:'vasp-potcar-selection/1',family:state.potentialFamily,species:state.structure.species,potentials:state.potentials,source:'https://www.vasp.at/wiki/Choosing_pseudopotentials',verified:D.verified},null,2)+'\n';}
  function openUpload(kind){uploadKind=kind;$('#file-input').accept=kind==='PROJECT'?'.json':'';$('#file-input').value='';$('#file-input').click();}
  async function importFile(file,kind){
    if(file.size>80*1024*1024)throw Error('文件超过 80 MB 浏览器导入限制');const text=await file.text();
    if(kind==='PROJECT'){const v=C.validateSession(JSON.parse(text));const apply=()=>{state={...initial(),...v,potcarMeta:[]};potcarFile=null;drafts={};history=[];selected.clear();active='INCAR';nav='work';viewMode='form';recalc();persist();render();toast('项目已载入');};confirmAction('打开项目','当前项目将被替换。请先保存需要保留的设置。',apply,'打开项目');return;}
    if(kind==='POTCAR'){
      if(text.trim().startsWith('{')){const x=JSON.parse(text);if(x.schema!=='vasp-potcar-selection/1')throw Error('不是本工具的赝势选择清单');if(JSON.stringify(x.species)!==JSON.stringify(state.structure.species))throw Error('选择清单的元素顺序与当前 POSCAR 不一致');if(!['PBE','LDA'].includes(x.family))throw Error('不支持该势库标识');for(const e of x.species)if(! /^[A-Za-z][A-Za-z0-9_.]*$/.test(x.potentials?.[e]||''))throw Error('势目录名无效');state.potentials=x.potentials;state.potentialFamily=x.family;toast('已载入赝势选择清单');}
      else {state.potcarMeta=C.parsePotcar(text);potcarFile=file;toast('已读取 POTCAR 元数据；请查看输入检查。');}
      persist();render();return;
    }
    if(!['INCAR','POSCAR','KPOINTS'].includes(kind))throw Error('请在对应文件页上传，或使用标准文件名。');
    active=kind;nav='work';viewMode='raw';drafts[kind]=text;render();applyDraft();
  }
  const actions={
    'nav-work':()=>{nav='work';render();},'nav-output':()=>{nav='output';render();},'nav-library':()=>{nav='library';render();},'nav-guide':()=>{nav='guide';render();},
    tab:el=>{active=el.dataset.tab;nav='work';viewMode=drafts[active]!==undefined?'raw':'form';render();},
    'view-form':()=>{viewMode='form';render();if(dirty())toast('原文有未应用修改，导出前需处理。');},'view-raw':()=>{viewMode='raw';render();},
    upload:el=>openUpload(el.dataset.file||active),'save-project':()=>{if(!requireClean())return;download('vasp-project.json',exportSession(),'application/json');toast('已保存项目 JSON');},'download-file':exportFile,'copy-file':()=>{if(requireClean())copy(fileText(active));},'export-all':doExportAll,checks:()=>showChecks(),library:openLibrary,
    preset:el=>choosePreset(el.dataset.preset),
    'add-param':el=>{if(!requireClean())return;const p=D.parameters.find(x=>x.tag===el.dataset.tag);state.incar[p.tag]=p.initial;persist();if($('#modal').open){refreshLibrary();}else render();toast('已添加 '+p.tag+'；请按体系修改示例值。');},
    'remove-param':el=>{if(!requireClean())return;delete state.incar[el.dataset.tag];persist();render();},
    'custom-param':()=>showModal('添加自定义参数',`<p>标签和值会原样写入 INCAR。未知标签没有内置语义检查。</p><div class="fields two spaced">${field('参数标签',input('custom-tag','','placeholder="如 LMAXTAU"'))}${field('参数值',input('custom-value','','placeholder="如 6"'))}</div>`,btn('取消','close-modal')+btn('添加参数','save-custom','primary'),true),
    'save-custom':()=>{if(!requireClean())return;const tag=$('#custom-tag').value.trim().toUpperCase(),v=$('#custom-value').value.trim();if(!/^[A-Z][A-Z0-9_/]*$/.test(tag)||!v)throw Error('请输入有效标签与非空参数值');if(/[;!#\r\n]/.test(v))throw Error('请只填写参数值，多语句请使用原文编辑器');state.incar[tag]=v;persist();closeModal();render();toast('已添加 '+tag);},
    'close-modal':()=>{closeModal();render();},'confirm-modal':()=>{const fn=modalCallback;closeModal();fn?.();},
    'apply-draft':applyDraft,'discard-draft':()=>{delete drafts[active];render();toast('已放弃未应用的原文修改');},
    'viewer-reset':()=>viewers.forEach(v=>v.reset()),'viewer-axis':el=>viewers.forEach(v=>v.view(el.dataset.axis)),
    'apply-lengths':()=>{const p=C.cellParameters(state.structure.lattice),l=state.structure.lattice.map((r,i)=>{const n=C.finite($('#length-'+i).value,'晶胞长度');if(n<=0)throw Error('晶胞长度必须为正');return C.scale(r,n/p.lengths[i]);});mutateStructure(C.editCell(state.structure,l,$('#keep-coordinate').value==='cart'),'已修改晶胞常数');},
    'apply-matrix':()=>{const l=[0,1,2].map(i=>[0,1,2].map(j=>C.finite($(`#matrix-${i}-${j}`).value)));mutateStructure(C.editCell(state.structure,l,$('#keep-coordinate').value==='cart'),'已修改晶格矩阵');},
    supercell:()=>mutateStructure(C.supercell(state.structure,[0,1,2].map(i=>$('#rep-'+i).value)),'已生成超胞；请重新核对按原子/物种排列的 INCAR 数组'),
    'wrap-atoms':()=>{const s=C.clone(state.structure);s.atoms.forEach(a=>a.frac=a.frac.map(C.wrap));s.tail='';mutateStructure(s,'坐标已折回 [0,1) 晶胞');},
    'apply-species':()=>{const names=$('#species-names').value.trim().split(/\s+/);if(names.length!==state.structure.species.length||names.some(e=>!C.elements.includes(e)))throw Error('请按原分组数输入有效元素符号（注意大小写）');const s=C.clone(state.structure);s.species=names;s.legacy=false;s.tail='';mutateStructure(s,'已修改元素名称；请匹配实际 POTCAR');},
    'undo-structure':()=>{if(!requireClean()||!history.length)return;state.structure=history.pop();selected.clear();recalc();persist();render();toast('已撤销上一次结构操作');},
    'fix-selected':()=>setFlags(false),'free-selected':()=>setFlags(true),
    'delete-selected':()=>{if(!selected.size)throw Error('请先选择原子位点');const s=C.deleteAtoms(state.structure,[...selected]);confirmAction('删除所选位点',`将删除 ${selected.size} 个位点，并同步元素数量。操作后可以撤销；MAGMOM 与 U 数组需重新核对。`,()=>mutateStructure(s,'已删除位点'),'删除位点');},
    'atoms-prev':()=>{atomPage--;render();},'atoms-next':()=>{atomPage++;render();},
    density:el=>{if(!requireClean())return;applyMeshRecommendation(Number(el.dataset.density));},'recommend-mesh':()=>{if(!requireClean())return;applyMeshRecommendation(C.finite($('#k-spacing').value));},
    'manual-mesh':()=>{if(!requireClean())return;state.kpoints={kind:'mesh',scheme:$('#k-scheme').value,mesh:[0,1,2].map(i=>C.positiveInt($('#mesh-'+i).value,'k 网格')),shift:[0,1,2].map(i=>C.finite($('#shift-'+i).value,'平移'))};state.autoMesh=false;delete drafts.KPOINTS;persist();render();toast('已应用手动网格，自动联动已关闭');},
    'download-pot-selection':()=>download('potcar-selection.json',potSelection(),'application/json'),
    'download-pot-original':()=>{if(!potcarFile)throw Error('请重新上传原始 POTCAR');download('POTCAR',potcarFile);},
    'clear-pot':()=>{potcarFile=null;state.potcarMeta=[];persist();render();toast('已移除 POTCAR 原件引用');}
  };
  function applyMeshRecommendation(spacing=state.spacing){const k=state.kpoints,mesh=C.recommendMesh(state.structure,spacing,state.periodic);state.spacing=spacing;state.autoMesh=true;state.kpoints={kind:'mesh',scheme:$('#k-scheme')?.value||k.scheme||'Gamma',mesh,shift:[0,0,0]};delete drafts.KPOINTS;persist();render();toast('已按当前结构更新网格建议');}
  function setFlags(value){if(!selected.size)throw Error('请先选择原子位点');const s=C.clone(state.structure);for(const i of selected)s.atoms[i].flags=[value,value,value];s.selective=true;s.tail='';mutateStructure(s,value?'所选位点已释放':'所选位点已固定');}
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');if(el){if(el.closest('summary')){e.preventDefault();e.stopPropagation();}safe(()=>actions[el.dataset.action]?.(el));}
    if(e.target.matches('[data-param]'))e.stopPropagation();
  });
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.param){if(!requireClean())return;state.incar[el.dataset.param]=el.value.trim();persist();refreshPreview();}
    if(el.dataset.draft){drafts[el.dataset.draft]=el.value;const changed=el.value!==fileText(el.dataset.draft);$('#draft-label').textContent=changed?'原文已修改，尚未应用':'原文与工作台一致';$('#draft-bar').classList.toggle('dirty',changed);refreshPreview();}
    if(el.id==='param-search'){filter=el.value;$('#parameter-list').innerHTML=parameterList();}
    if(el.id==='library-search')refreshLibrary();
  });
  document.addEventListener('change',e=>safe(()=>{
    const el=e.target;
    if(el.dataset.param){if(!requireClean())return render();const v=el.value.trim();if(!v)throw Error('参数值不能为空，移除参数请点 ×');if(/[;!#\r\n]/.test(v)&&!/^"[\s\S]*"$/.test(v))throw Error('参数表只接受单个值；多行或复杂语法请用原文编辑器');state.incar[el.dataset.param]=v;persist();const tag=el.dataset.param;render();const d=document.querySelector(`[data-tag="${tag}"]`);if(d?.tagName==='DETAILS')d.open=true;}
    if(el.id==='preset-select')choosePreset(el.value);
    if(el.id==='param-group'){group=el.value;$('#parameter-list').innerHTML=parameterList();}
    if(el.id==='library-group')refreshLibrary();
    if(el.id==='example-select'&&el.value){if(!requireClean())return render();const value=el.value;confirmAction('加载示例结构','当前结构将被示例替换。示例仅用于演示界面，不是已验证的计算结构。',()=>{const s=C.parsePoscar(D.examples[value]);mutateStructure(s,'已加载示例结构');state.name=value+'-demo';state.periodic=value==='mos2'?[true,true,false]:[true,true,true];recalc();persist();render();},'加载示例');}
    if(el.id==='coord-mode'){if(!requireClean())return render();state.structure.mode=el.value;persist();render();}
    if(el.id==='show-bonds')viewers.forEach(v=>{v.bonds=el.checked;v.draw();});
    if(el.id==='show-labels')viewers.forEach(v=>{v.labels=el.checked;v.draw();});
    if(el.dataset.atomSelect!==undefined){const i=Number(el.dataset.atomSelect);if(el.checked)selected.add(i);else selected.delete(i);syncSelection();}
    if(el.id==='select-all'){selected=el.checked?new Set(state.structure.atoms.map((_,i)=>i)):new Set();syncSelection();}
    if(el.dataset.atomCoordinate!==undefined){const s=C.clone(state.structure);s.atoms[Number(el.dataset.atomCoordinate)].frac[Number(el.dataset.axis)]=C.finite(el.value,'坐标');s.tail='';mutateStructure(s,'原子坐标已更新');}
    if(el.dataset.atomFlag!==undefined){const s=C.clone(state.structure);s.atoms[Number(el.dataset.atomFlag)].flags[Number(el.dataset.axis)]=el.checked;s.selective=true;s.tail='';mutateStructure(s,'固定标记已更新');}
    if(el.dataset.periodic!==undefined){if(!requireClean())return render();state.periodic[Number(el.dataset.periodic)]=el.checked;recalc();persist();render();}
    if(el.id==='auto-mesh'){if(!requireClean())return render();state.autoMesh=el.checked;if(el.checked){state.spacing=C.finite($('#k-spacing').value);applyMeshRecommendation();}else{persist();render();}}
    if(el.id==='k-spacing'){if(!requireClean())return render();const v=C.finite(el.value,'间距');C.recommendMesh(state.structure,v,state.periodic);state.spacing=v;recalc();persist();render();}
    if(el.id==='k-scheme'&&state.kpoints.kind==='mesh'){if(!requireClean())return render();state.kpoints.scheme=el.value;persist();render();}
    if(el.dataset.potential){const v=el.value.trim();if(! /^[A-Za-z][A-Za-z0-9_.]*$/.test(v))throw Error('势目录名格式无效');const element=(v.match(/^[A-Z][a-z]?/)||[])[0];if(element!==el.dataset.potential)throw Error('势目录名与元素不匹配');state.potentials[el.dataset.potential]=v;persist();render();}
    if(el.id==='potential-family'){state.potentialFamily=el.value;persist();render();}
  }));
  $('#file-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{await importFile(file,uploadKind);}catch(err){toast(err.message,true);}});
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files')){e.preventDefault();$('#workspace')?.classList.add('drop-active');}});
  document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#workspace')?.classList.remove('drop-active');});
  document.addEventListener('drop',async e=>{e.preventDefault();$('#workspace')?.classList.remove('drop-active');if(nav==='output'){VaspOutputUI.importFiles([...e.dataTransfer.files]);return;}const f=e.dataTransfer?.files[0];if(!f)return;const upper=f.name.toUpperCase(),kind=['INCAR','POSCAR','KPOINTS','POTCAR'].find(x=>upper===x||upper.startsWith(x+'.'))||(upper==='CONTCAR'?'POSCAR':upper.endsWith('.JSON')?'PROJECT':active);try{await importFile(f,kind);}catch(err){toast(err.message,true);}});
  window.addEventListener('beforeunload',e=>{if(dirty()||VaspOutputUI.isBusy()){e.preventDefault();e.returnValue='';}});
  $('#modal').addEventListener('cancel',()=>{modalCallback=null;render();});
  ensurePotentials();render();persist();if(restoreMessage)toast(restoreMessage);
})();

</script>
